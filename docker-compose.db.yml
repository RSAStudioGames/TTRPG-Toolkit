# PostgreSQL only — for local dev with ./ttrpg-toolkit on the host.
#
#   docker compose -f docker-compose.db.yml up -d
#
# Use in .env:
#   TTRPG_DATABASE_URL=postgres://ttrpg:ttrpg@localhost:43021/ttrpg_toolkit?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '43021:5432'
    environment:
      POSTGRES_USER: ttrpg
      POSTGRES_PASSWORD: ttrpg
      POSTGRES_DB: ttrpg_toolkit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ttrpg -d ttrpg_toolkit']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
